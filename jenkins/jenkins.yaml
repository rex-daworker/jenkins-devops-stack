tool:
  nodejs:
    installations:
    - name: "node20"
      properties:
      - installSource:
          installers:
          - nodeJSInstaller:
              id: "20.20.2"
              npmPackagesRefreshHours: 72
  sonarRunnerInstallation:
    installations:
    - name: "sonar-scanner"
      properties:
      - installSource:
          installers:
          - sonarRunnerInstaller:
              id: "8.1.0.6389"

unclassified:
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
    - name: "sonarqube"
      serverUrl: "http://sonarqube:9000"
      credentialsId: "sonar-token"
credentials:
  system:
    domainCredentials:
    - credentials:
      - string:
          id: "sonar-token"
          scope: GLOBAL
          secret: "${SONAR_TOKEN}"
      - usernamePassword:
          id: "nexus-creds"
          scope: GLOBAL
          username: "jenkins-publisher"
          password: "${NEXUS_PUBLISHER_PASSWORD}"
          description: "Nexus publisher for trading-app-releases"